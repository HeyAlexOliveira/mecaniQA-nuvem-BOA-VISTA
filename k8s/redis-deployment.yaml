apiVersion: apps/v1
kind: Deployment

metadata:
  name: mecaniqa-redis

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mecaniqa-redis

  template:
    metadata:
      labels:
        app: mecaniqa-redis

    spec:
      containers:
        - name: mecaniqa-redis
          image: redis:alpine
          ports:
            - containerPort: 6379