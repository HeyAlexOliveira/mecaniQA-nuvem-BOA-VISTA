apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: mecaniqa
        folder: MecaniQA
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards
