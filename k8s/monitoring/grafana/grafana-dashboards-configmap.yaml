apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  cpu.json: |
    {
      "uid": "mecaniqa-cpu",
      "title": "MecaniQA - CPU",
      "tags": ["mecaniqa", "oat2"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "Uso de CPU do simulador",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "rate(process_cpu_seconds_total{job=\"iot-simulator\"}[1m]) * 100",
              "legendFormat": "CPU (%)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true
            },
            "tooltip": {
              "mode": "single"
            }
          }
        }
      ]
    }
  erros.json: |
    {
      "uid": "mecaniqa-erros",
      "title": "MecaniQA - Erros",
      "tags": ["mecaniqa", "oat2"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "Taxa de erros (%)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "100 * sum(rate(mecaniqa_sensor_errors_total{job=\"iot-simulator\"}[1m])) / clamp_min(sum(rate(mecaniqa_sensor_readings_total{job=\"iot-simulator\"}[1m])), 0.000001)",
              "legendFormat": "Erros (%)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true
            },
            "tooltip": {
              "mode": "single"
            }
          }
        }
      ]
    }
  memoria.json: |
    {
      "uid": "mecaniqa-memoria",
      "title": "MecaniQA - Memória",
      "tags": ["mecaniqa", "oat2"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "Memória utilizada pelo simulador",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "process_resident_memory_bytes{job=\"iot-simulator\"}",
              "legendFormat": "Memória residente",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true
            },
            "tooltip": {
              "mode": "single"
            }
          }
        }
      ]
    }
  sucessos.json: |
    {
      "uid": "mecaniqa-sucessos",
      "title": "MecaniQA - Sucessos",
      "tags": ["mecaniqa", "oat2"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "Leituras por segundo",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(mecaniqa_sensor_readings_total{job=\"iot-simulator\"}[1m]))",
              "legendFormat": "Leituras/s",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true
            },
            "tooltip": {
              "mode": "single"
            }
          }
        }
      ]
    }
